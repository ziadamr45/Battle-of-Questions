services:
  - type: web
    name: ma3raka-game-service
    runtime: node
    plan: free
    buildCommand: cd mini-services/game-service && npm install
    startCommand: cd mini-services/game-service && npx tsx index.ts
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-001
      - key: NEXT_APP_URL
        value: https://ma3raka.vercel.app
      - key: NODE_ENV
        value: production
