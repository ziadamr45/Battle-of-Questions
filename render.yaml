services:
  - type: web
    name: ma3raka-game-service
    runtime: node
    plan: free
    buildCommand: cd mini-services/game-service && npm install
    startCommand: cd mini-services/game-service && npx tsx index.ts
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/deepseek-v4-flash
      - key: NEXT_APP_URL
        value: https://ma3raka.vercel.app
      - key: NODE_ENV
        value: production
