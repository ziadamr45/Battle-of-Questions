    <path d="M-4 -30 Q-30 -35 -55 -28 L-55 20 Q-30 14 -4 18 Z" fill="url(#bookPageLeft)" stroke="#991B1B" stroke-width="1"/>
    <line x1="-48" y1="-18" x2="-10" y2="-22" stroke="#FCA5A5" stroke-width="0.8" opacity="0.5"/>
    <line x1="-48" y1="-10" x2="-10" y2="-14" stroke="#FCA5A5" stroke-width="0.8" opacity="0.5"/>
    <line x1="-48" y1="-2" x2="-10" y2="-6" stroke="#FCA5A5" stroke-width="0.8" opacity="0.5"/>
