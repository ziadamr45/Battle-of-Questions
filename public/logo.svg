    <circle cx="300" cy="346" r="5" fill="url(#gemAmber)"/>
    <circle cx="270" cy="346" r="4" fill="url(#amberMetal)" stroke="#92400E" stroke-width="0.5"/>
    <circle cx="330" cy="346" r="4" fill="url(#amberMetal)" stroke="#92400E" stroke-width="0.5"/>
    <rect x="293" y="352" width="14" height="36" rx="3" fill="#451A03" stroke="#92400E" stroke-width="1"/>
    <line x1="294" y1="358" x2="306" y2="358" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <line x1="294" y1="364" x2="306" y2="364" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <line x1="294" y1="370" x2="306" y2="370" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <line x1="294" y1="376" x2="306" y2="376" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <circle cx="300" cy="394" r="9" fill="url(#amberMetal)" stroke="#92400E" stroke-width="1"/>
    <circle cx="300" cy="394" r="5" fill="url(#gemAmber)"/>
  </g>

  <!-- Shield -->
  <use href="#shieldShape" fill="#000" opacity="0.3" transform="translate(4,4)"/>
  <use href="#shieldShape" fill="url(#shieldRed)" clip-path="url(#shieldLeftClip)"/>
  <use href="#shieldShape" fill="url(#shieldAmber)" clip-path="url(#shieldRightClip)"/>
  <line x1="256" y1="48" x2="256" y2="460" stroke="#FBBF24" stroke-width="1.5" opacity="0.4"/>
  <use href="#shieldShape" fill="none" stroke="url(#shieldBorder)" stroke-width="4"/>
  <path d="M256 58 L380 96 Q408 107 408 140 L408 275 Q408 372 256 448 Q104 372 104 275 L104 140 Q104 107 132 96 Z" fill="none" stroke="url(#shieldBorder)" stroke-width="1.5" opacity="0.5"/>
  <path d="M140 92 Q170 82 200 88" fill="none" stroke="#FCA5A5" stroke-width="1.5" opacity="0.6"/>
  <path d="M312 88 Q342 82 372 92" fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.6"/>
  <path d="M256 62 L264 72 L256 82 L248 72 Z" fill="url(#gemCenter)" stroke="url(#shieldBorder)" stroke-width="1" filter="url(#strongGlow)"/>

  <!-- Question Mark -->
  <g filter="url(#innerShadow)" transform="translate(0,-10)">
    <path d="M220 140 Q220 110 256 100 Q292 110 292 140 Q292 165 268 180 L268 210 L244 210 L244 175 Q264 163 264 140 Q264 128 256 124 Q248 128 248 140 Z" fill="url(#questionGrad)" stroke="#92400E" stroke-width="1.5"/>
